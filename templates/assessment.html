<!DOCTYPE html>
<html>
<head>
    <title>EcoBuddy Assessment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="assessment-wrapper">

    <!-- TOP HEADER -->
<div class="assessment-header">

    <a href="/" class="home-btn">
    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000">
        <path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/>
    </svg>
    
</a>

    <div class="logo assessment-logo"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" 
            fill="#000000"><path d="M480-240q100 0 169-70t71-170v-240H480q-100 2-170 71t-70 169q0 100 70 170t170 70Zm-47-67 
            184-164q9-8 5-19t-16-13l-144-14 86-119q3-5 3.5-9.5T548-654q-4-5-10-4.5t-11 4.5L344-490q-9 8-5 19t16 13l144 14-87 
            119q-3 5-3 9.5t4 8.5q4 4 9.5 4t10.5-4Zm47 147q-56 0-105.5-17.5T284-227l-55 55q-6 6-13.5 9t-15.5 3q-17 0-28.5-11.5T160-200q0-8 
            3-15.5t9-13.5l55-55q-32-41-49.5-90.5T160-480q0-134 93-227t227-93h320v320q0 134-93 227t-227 93Zm0-320Z"/></svg> EcoBuddy</div>

    <div class="step-indicator">
        STEP <span id="step-num">1</span> / 9
    </div>

</div>

    <!-- PROGRESS BAR -->
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <!-- MAIN CARD -->
    <div class="assessment-card">

        <!-- ICON -->
        <div class="icon-box" id="icon"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000">
                            <path d="M160-340v-380q0-53 27.5-84.5t72.5-48q45-16.5 102.5-22T480-880q66 0 124.5 5.5t102 22q43.5 16.5 68.5 48t25 84.5v380q0 
                            59-40.5 99.5T660-200l60 60v20h-80l-80-80H400l-80 80h-80v-20l60-60q-59 0-99.5-40.5T160-340Zm320-460q-106 0-155 12.5T258-760h448q-15-17-64.5-28.5T480-800ZM240-560h200v-120H240v120Zm420 
                            80H240h480-60Zm-140-80h200v-120H520v120ZM383-337q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm280 0q17-17 
                            17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-363 57h360q26 0 43-17t17-43v-140H240v140q0 26 17 43t43 17Zm180-480h226-448 222Z"/>
                        </svg> </div>

        <!-- QUESTION -->
        <h2 id="question">How do you usually travel?</h2>

        <!-- SUBTEXT -->
        <p id="subtext">Your primary mode of transport for daily commute.</p>

        <!-- OPTIONS -->
        <div class="options-grid" id="options"></div>

        <!-- BUTTONS -->
        <div class="nav-buttons">

            <button id="backBtn" onclick="prevStep()">Back</button>

            <button id="continueBtn" onclick="nextStep()" disabled>
                Continue
            </button>

        </div>

    </div>

</div>

<script>
/* =========================
   QUESTIONS DATA
========================= */

const questions = [
    {
        icon: "🚗",
        question: "How do you usually travel?",
        subtext: "Your primary mode of transport for daily commute.",
        options: ["Petrol Car", "Diesel Car", "Bus", "Bike", "Train", "Walk"]
    },
    {
        icon: "⚡",
        question: "How much electricity do you use daily?",
        subtext: "Approximate usage in kWh per day.",
        options: ["< 5 kWh", "5–10 kWh", "10–20 kWh", "> 20 kWh"]
    },
    {
        icon: "🥩",
        question: "What does your typical daily diet look like?",
        subtext: "Food production is a major contributor to carbon emissions.",
        options: ["Frequent Meat", "Balanced Diet", "Vegetarian", "Vegan"]
    },
    {
        icon: "✈️",
        question: "How many flights do you take each year?",
        subtext: "Includes both domestic and international roundtrips.",
        options: ["0 flights", "1–2 flights", "3–5 flights", "More than 5"]
    },
    {
        icon: "🔥",
        question: "What is the primary heating source in your home?",
        subtext: "The energy type used to keep your living space warm.",
        options: ["Natural Gas", "Electricity", "Heating Oil", "Biomass / Solar"]
    },
    {
        icon: "🛍️",
        question: "How often do you buy new consumer goods?",
        subtext: "Includes clothing, electronics, and household items.",
        options: ["Very Often", "Moderate", "Rarely", "Almost Never"]
    },
    {
        icon: "🗑️",
        question: "How much waste does your household generate?",
        subtext: "Your typical weekly trash output compared to neighbors.",
        options: ["Above Average", "Average", "Below Average", "Very Little"]
    },
    {
        icon: "♻️",
        question: "How strictly do you sort recycling and compost?",
        subtext: "Proper sorting diverts high-emission waste from landfills.",
        options: ["Everything", "Most Things", "Occasionally", "Do Not Sort"]
    },
    {
        icon: "💧",
        question: "What are your household water consumption habits?",
        subtext: "Reflects laundry frequency, lawn watering, and shower times.",
        options: ["High Usage", "Moderate Usage", "Conscious Saving"]
    }
];


/* =========================
   STATE
========================= */

let currentStep = 0;
let selectedAnswer = null;
let answers = {};

/* =========================
   LOAD QUESTION
========================= */

function loadQuestion() {
    const q = questions[currentStep];

    document.getElementById("icon").innerText = q.icon;
    document.getElementById("question").innerText = q.question;
    document.getElementById("subtext").innerText = q.subtext;
    document.getElementById("step-num").innerText = currentStep + 1;

    // progress bar
    let progress = ((currentStep + 1) / questions.length) * 100;
    document.getElementById("progress").style.width = progress + "%";

    // Check if there is an existing answer saved for this step
    if (answers[currentStep] !== undefined) {
        selectedAnswer = answers[currentStep];
        document.getElementById("continueBtn").disabled = false;
    } else {
        selectedAnswer = null;
        document.getElementById("continueBtn").disabled = true;
    }

    // render options
    const container = document.getElementById("options");
    container.innerHTML = "";

    q.options.forEach(opt => {
        const btn = document.createElement("div");
        btn.className = "option";
        btn.innerText = opt;

        // Re-apply the active visual state if it matches our saved selection
        if (opt === selectedAnswer) {
            btn.classList.add("selected");
        }

        btn.onclick = () => selectOption(btn, opt);

        container.appendChild(btn);
    });
}


/* =========================
   SELECT OPTION
========================= */

function selectOption(btn, value) {
    selectedAnswer = value;

    document.querySelectorAll(".option").forEach(o => {
        o.classList.remove("selected");
    });

    btn.classList.add("selected");

    document.getElementById("continueBtn").disabled = false;
}

/* =========================
   NEXT / BACK
========================= */

function nextStep() {
    answers[currentStep] = selectedAnswer;

    if (currentStep < questions.length - 1) {
        currentStep++;
        loadQuestion();
    } else {
        // Create an automated form pipeline submission on step 9 completion
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/result';

        for (const key in answers) {
            const hiddenField = document.createElement('input');
            hiddenField.type = 'hidden';
            hiddenField.name = `question_${key}`;
            hiddenField.value = answers[key];
            form.appendChild(hiddenField);
        }

        document.body.appendChild(form);
        form.submit();
    }
}


function prevStep() {
    if (currentStep > 0) {
        currentStep--;
        loadQuestion();
    }
}

/* INIT */
loadQuestion();
</script>

</body>
</html>
